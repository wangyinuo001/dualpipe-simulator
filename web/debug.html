<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DualPipe · 同屏调度对比</title><link rel="stylesheet" href="/debug.css"></head><body>

<form id="experiment"><label>实验<select id="case"><option value="baseline">01 基础：M=8，C=0.1</option><option value="high_comm">02 通信增加：M=8，C=1.0</option><option value="more_microbatches">03 微批增加：M=16，C=0.1</option></select></label><label>阶段 P<input id="pp" type="number" min="2" max="8" value="4" required></label><label>微批 M<input id="mb" type="number" min="2" max="32" step="2" value="8" required></label><label>通信 C<input id="comm" type="number" min=".01" max="10" step="any" value=".1" required></label><label>资源<select id="resources"><option value="true">计算 / 通信可并行</option><option value="false">计算 / 通信串行</option></select></label><button id="run" type="submit" class="primary">运行对照实验</button><span id="durations">F = B = W = 1</span></form>
<div id="status" role="status"></div>
<section class="toolbar"><strong id="clock">t = 0.00</strong><label>突出微批<select id="focus"><option value="all">全部</option></select></label><button id="previous" disabled>← 上一步</button><button id="next" disabled>下一步 →</button><button id="play" disabled>同步播放</button><select id="pace" aria-label="播放速度"><option value="650">1×</option><option value="130">5×</option><option value="65">10×</option><option value="26">25×</option><option value="21.6666666667" selected>30×</option></select><button id="overlap" disabled>找一次重叠</button><button id="first-finish" disabled>先完成时刻</button><button id="end" disabled>看完整结果</button><button id="download" disabled>保存记录</button><button id="fullscreen" type="button">全屏</button><a href="/overview">完整时间轴 ↗</a></section>
<main id="comparison"></main>
<div id="comparison-result" aria-live="polite">运行后，两种调度在共同的仿真时钟下同步展示。</div>
<footer><span class="legend"><i class="f"></i>F 前向 <i class="b"></i>B 输入梯度 <i class="w"></i>W 权重梯度 <i class="comm"></i>通信 <span>轮廓：已启动　填实：已完成</span></span><details><summary>模型说明</summary><p>两个面板回放实际 Python 执行状态，同一时刻内按各自的程序顺序更新。上下时间轴使用同一尺度。下方为简化双向优先级调度，未完整复现官方 DualPipe 的局部算子重叠；模型时间不代表真实 GPU 测时。</p></details></footer>
<script src="/debug.js"></script></body></html>
